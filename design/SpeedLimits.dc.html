<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>qBit — Ограничение скорости</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#09090B}
a{color:#93C5FD}a:hover{color:#BFDBFE}
</style>
</helmet>
<div style="width: 460px; height: 470px; box-sizing: border-box; padding: 20px; background: #050506; color: #FAFAFA; font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; display: flex">
  <section role="dialog" aria-label="Ограничение скорости" style="flex: 1; box-sizing: border-box; border: 1px solid #27272A; border-radius: 16px; background: #0F0F12; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 14px">
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <h2 style="margin: 0; font-size: 16px; font-weight: 600">Ограничение скорости</h2>
        <span style="font-size: 12px; color: #A1A1AA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Blender 4.3 Splash Assets</span>
      </div>
      <button aria-label="Закрыть" style="width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: #A1A1AA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </div>

    <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; gap: 4px; padding: 3px; border-radius: 9px; background: #18181B">
        <button style="flex: 1; height: 30px; border: 0; border-radius: 7px; background: #27272A; color: #FAFAFA; font: inherit; font-weight: 500">Для торрента</button>
        <button style="flex: 1; height: 30px; border: 0; border-radius: 7px; background: transparent; color: #A1A1AA; font: inherit">Глобальные</button>
        <button style="flex: 1; height: 30px; border: 0; border-radius: 7px; background: transparent; color: #A1A1AA; font: inherit">Альтернативные</button>
      </div>

      <sc-for list="{{limits}}" as="l" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="flex: 1; display: flex; align-items: center; gap: 8px; color: #D4D4D8"><span style="color: {{l.color}}">{{l.arrow}}</span>{{l.label}}</span>
            <span style="width: 120px; height: 34px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid #27272A; border-radius: 8px; background: #09090B">
              <input value="{{l.value}}" aria-label="{{l.label}}" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #FAFAFA; font-family: 'JetBrains Mono', monospace; font-size: 13px; text-align: right">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A1A1AA">МБ/с</span>
            </span>
          </div>
          <div style="display: flex; gap: 6px">
            <sc-for list="{{l.presets}}" as="p" hint-placeholder-count="5">
              <button style="flex: 1; height: 28px; border: 1px solid {{p.border}}; border-radius: 7px; background: {{p.bg}}; color: {{p.fg}}; font-family: 'JetBrains Mono', monospace; font-size: 11px">{{p.label}}</button>
            </sc-for>
          </div>
        </div>
      </sc-for>

      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #27272A; border-radius: 10px; background: #0C0C0E; color: #A1A1AA; font-size: 12px; line-height: 1.45">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex: none" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
        <span>Глобальный лимит отдачи 5 МБ/с всё равно действует сверху.</span>
      </div>
    </div>

    <div style="margin-top: auto; display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid #1F1F23">
      <button style="height: 36px; padding: 0 14px; border: 1px solid #27272A; border-radius: 9px; background: transparent; color: #FAFAFA; font: inherit; font-weight: 500">Отмена</button>
      <button style="height: 36px; padding: 0 16px; border: 0; border-radius: 9px; background: {{accent}}; color: #09090B; font: inherit; font-weight: 600">Применить</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#60A5FA","options":["#60A5FA","#A78BFA","#22D3EE","#FBBF24"]},"$preview":{"width":460,"height":470}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#60A5FA';
    const pre = (active) => ['∞', '1', '5', '10', '50'].map(v => ({
      label: v, bg: v === active ? '#18181B' : 'transparent', fg: v === active ? accent : '#A1A1AA', border: v === active ? accent : '#27272A'
    }));
    return {
      accent,
      limits: [
        { label: 'Загрузка', arrow: '↓', color: accent, value: '∞', presets: pre('∞') },
        { label: 'Отдача', arrow: '↑', color: '#4ADE80', value: '1', presets: pre('1') }
      ]
    };
  }
}
</script>
</body>
</html>
