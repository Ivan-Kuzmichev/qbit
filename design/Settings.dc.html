<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>qBit — Настройки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#09090B}
a{color:#93C5FD}a:hover{color:#BFDBFE}
</style>
</helmet>
<div style="min-height: 900px; background: #09090B; color: #FAFAFA; font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; display: flex; flex-wrap: wrap">

  <aside style="flex: 1 1 220px; max-width: 236px; box-sizing: border-box; padding: 20px 12px 16px; background: #0C0C0E; border-right: 1px solid #1F1F23; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
      <div style="width: 28px; height: 28px; border-radius: 8px; background: {{accent}}; color: #09090B; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 20h14"></path></svg>
      </div>
      <span style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em">qBit</span>
    </div>
    <nav style="display: flex; flex-direction: column; gap: 2px" aria-label="Фильтры">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
        <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 8px; color: #D4D4D8; font-size: 13px; text-decoration: none">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{f.icon}}"></path></svg>
          <span style="flex: 1">{{f.label}}</span>
          <span style="min-width: 20px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #1C1C20; color: #A1A1AA; font-family: 'JetBrains Mono', monospace; font-size: 11px; display: flex; align-items: center; justify-content: center">{{f.count}}</span>
        </a>
      </sc-for>
    </nav>
    <button style="margin-top: auto; position: relative; display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border: 0; border-radius: 8px; background: #18181B; color: #FAFAFA; font: inherit; font-size: 13px">
      <span style="position: absolute; left: -12px; top: 9px; width: 3px; height: 20px; border-radius: 0 2px 2px 0; background: {{accent}}"></span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>Настройки
    </button>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 20px 24px 28px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 12px">
      <h1 style="flex: 1; margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em">Настройки</h1>
      <span style="font-size: 12px; color: #A1A1AA">Есть несохранённые изменения</span>
      <button style="height: 36px; padding: 0 14px; border: 1px solid #27272A; border-radius: 9px; background: transparent; color: #FAFAFA; font: inherit; font-weight: 500">Сбросить</button>
      <button style="height: 36px; padding: 0 16px; border: 0; border-radius: 9px; background: {{accent}}; color: #09090B; font: inherit; font-weight: 600">Сохранить</button>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
      <nav style="flex: 1 1 160px; max-width: 190px; display: flex; flex-direction: column; gap: 2px" aria-label="Разделы настроек">
        <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="6">
          <button style="height: 34px; padding: 0 12px; border: 0; border-radius: 8px; background: {{tb.bg}}; color: {{tb.fg}}; font: inherit; font-size: 13px; text-align: left">{{tb.label}}</button>
        </sc-for>
      </nav>

      <div style="flex: 999 1 480px; min-width: 0; max-width: 760px; display: flex; flex-direction: column; gap: 16px">
        <sc-for list="{{cards}}" as="card" hint-placeholder-count="3">
          <section style="border: 1px solid #27272A; border-radius: 12px; background: #0F0F12">
            <div style="padding: 14px 18px; border-bottom: 1px solid #1F1F23; display: flex; flex-direction: column; gap: 2px">
              <h2 style="margin: 0; font-size: 14px; font-weight: 600">{{card.title}}</h2>
              <span style="font-size: 12px; color: #A1A1AA">{{card.desc}}</span>
            </div>
            <sc-for list="{{card.rows}}" as="r" hint-placeholder-count="3">
              <div style="display: flex; align-items: center; gap: 16px; padding: 12px 18px; border-bottom: 1px solid #18181B">
                <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                  <span style="font-size: 13px">{{r.label}}</span>
                  <span style="font-size: 11.5px; color: #A1A1AA">{{r.hint}}</span>
                </div>
                <sc-if value="{{r.isToggle}}" hint-placeholder-val="{{ true }}">
                  <button aria-label="{{r.label}}" aria-pressed="{{r.on}}" style="width: 36px; height: 20px; flex: none; position: relative; border: 0; padding: 0; border-radius: 10px; background: {{r.track}}">
                    <span style="position: absolute; top: 2px; left: {{r.knob}}; width: 16px; height: 16px; border-radius: 50%; background: {{r.knobBg}}"></span>
                  </button>
                </sc-if>
                <sc-if value="{{r.isInput}}" hint-placeholder-val="{{ false }}">
                  <span style="width: {{r.w}}; height: 34px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid #27272A; border-radius: 8px; background: #09090B">
                    <input value="{{r.value}}" aria-label="{{r.label}}" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #FAFAFA; font-family: 'JetBrains Mono', monospace; font-size: 12px">
                    <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A1A1AA">{{r.unit}}</span>
                  </span>
                </sc-if>
              </div>
            </sc-for>
          </section>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#60A5FA","options":["#60A5FA","#A78BFA","#22D3EE","#FBBF24"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#60A5FA';
    const I = {
      dl: 'M12 4v11m0 0 4-4m-4 4-4-4M5 20h14', seed: 'M12 20V9m0 0 4 4m-4-4-4 4M5 4h14',
      done: 'm5 12 5 5 9-10', pause: 'M9 5v14M15 5v14', all: 'M4 6h16M4 12h16M4 18h16'
    };
    const tg = (label, hint, on) => ({ label, hint, on, isToggle: true, isInput: false, track: on ? accent : '#3F3F46', knob: on ? '18px' : '2px', knobBg: on ? '#09090B' : '#D4D4D8' });
    const inp = (label, hint, value, unit, w) => ({ label, hint, value, unit, w: w || '160px', isToggle: false, isInput: true });
    const tabNames = ['Загрузки', 'Соединение', 'Скорость', 'BitTorrent', 'WebUI', 'Дополнительно'];
    return {
      accent,
      filters: [{ label: 'Все', count: 7, icon: I.all }, { label: 'Загрузка', count: 2, icon: I.dl }, { label: 'Раздача', count: 2, icon: I.seed }, { label: 'Завершено', count: 1, icon: I.done }, { label: 'Пауза', count: 2, icon: I.pause }],
      tabs: tabNames.map((l, i) => ({ label: l, bg: i === 0 ? '#18181B' : 'transparent', fg: i === 0 ? '#FAFAFA' : '#A1A1AA' })),
      cards: [
        { title: 'Сохранение', desc: 'Куда и как складывать файлы', rows: [
          inp('Папка по умолчанию', 'Для торрентов без категории', '/downloads', '', '260px'),
          tg('Отдельная папка для незавершённых', 'Файлы переедут в основную после загрузки', true),
          inp('Папка для незавершённых', '', '/downloads/.incomplete', '', '260px'),
          tg('Добавлять на паузе', 'Не начинать загрузку сразу', false),
          tg('Удалять .torrent после добавления', '', true)
        ] },
        { title: 'Ограничения скорости', desc: '0 — без ограничений', rows: [
          inp('Загрузка', 'Глобальный лимит', '0', 'КБ/с'),
          inp('Отдача', 'Глобальный лимит', '5000', 'КБ/с'),
          tg('Альтернативные лимиты по расписанию', 'Например, днём медленнее', false)
        ] },
        { title: 'Раздача', desc: 'Когда прекращать раздачу', rows: [
          inp('Остановить при ratio', '', '2.0', ''),
          inp('Или после времени раздачи', '', '1440', 'мин')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
