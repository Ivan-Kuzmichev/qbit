<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>qBit — Mobile настройки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#09090B}
a{color:#93C5FD}a:hover{color:#BFDBFE}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #09090B; color: #FAFAFA; font-family: 'Inter', system-ui, sans-serif; font-size: 13px; display: flex; flex-direction: column">
  <div style="padding: 8px 8px 4px; display: flex; align-items: center; gap: 4px">
    <a href="Mobile.dc.html" aria-label="Назад" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #D4D4D8">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 17px; font-weight: 600">Настройки</h1>
    <button style="margin-left: auto; height: 44px; padding: 0 12px; border: 0; background: transparent; color: {{accent}}; font: inherit; font-size: 14px; font-weight: 600">Сохранить</button>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 18px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="padding: 0 4px; font-size: 11px; font-weight: 500; color: #A1A1AA; letter-spacing: 0.08em; text-transform: uppercase">{{g.title}}</span>
        <div style="border: 1px solid #27272A; border-radius: 12px; background: #0F0F12">
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; border-bottom: 1px solid #18181B">
              <span style="flex: 1; min-width: 0">{{r.label}}</span>
              <sc-if value="{{r.isToggle}}" hint-placeholder-val="{{ false }}">
                <button aria-label="{{r.label}}" aria-pressed="{{r.on}}" style="width: 44px; height: 26px; position: relative; border: 0; padding: 0; border-radius: 13px; background: {{r.track}}">
                  <span style="position: absolute; top: 3px; left: {{r.knob}}; width: 20px; height: 20px; border-radius: 50%; background: {{r.knobBg}}"></span>
                </button>
              </sc-if>
              <sc-if value="{{r.isValue}}" hint-placeholder-val="{{ true }}">
                <span style="display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A1AA">{{r.value}}
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
                </span>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#60A5FA","options":["#60A5FA","#A78BFA","#22D3EE","#FBBF24"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#60A5FA';
    const tg = (label, on) => ({ label, on, isToggle: true, isValue: false, track: on ? accent : '#3F3F46', knob: on ? '21px' : '3px', knobBg: on ? '#09090B' : '#D4D4D8' });
    const val = (label, value) => ({ label, value, isToggle: false, isValue: true });
    return {
      accent,
      groups: [
        { title: 'Сохранение', rows: [val('Папка по умолчанию', '/downloads'), tg('Папка для незавершённых', true), tg('Добавлять на паузе', false)] },
        { title: 'Скорость', rows: [val('Лимит загрузки', '∞'), val('Лимит отдачи', '5 МБ/с'), tg('Лимиты по расписанию', false)] },
        { title: 'Раздача', rows: [val('Остановить при ratio', '2.0'), val('Время раздачи', '24 ч')] },
        { title: 'Ещё', rows: [val('Соединение', ''), val('BitTorrent', ''), val('WebUI', '')] }
      ]
    };
  }
}
</script>
</body>
</html>
